name: Trigger Remote Workflows (Artifacts way)

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'deploy env'
        required: true
        default: test-env
        type: choice
        options: [test-env, pre-prod, prod]
#  push:
#    paths:
#      - 'apps/*.yaml'
#      - '.github/actions/**'
#      - '.github/workflows/**'

env:
  TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
  VARS_TOKEN:    ${{ secrets.VARS_TOKEN }}
  ENVIRONMENT_NAME: ${{ inputs.environment-name }}
  CONFIGS_SAVE_PATH: .orchestrator-configs

permissions:
  contents: write
  actions: read

jobs:
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq (v4) & jq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          YQ_VER="v4.44.3"
          curl -sSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
          sudo install -m 0755 yq /usr/local/bin/yq
          yq --version

      - name: Build matrix from apps/*.yaml
        id: set-targets
        shell: bash
        env:
          ENV_NAME: ${{ env.ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          arr='[]'
          shopt -s nullglob
          for f in apps/*.yaml apps/*.yml; do
            base="$(basename "$f")"
            fallback_name="${base%.*}"
      
            obj="$(yq -o=json '.' "$f" | jq -c --arg env "$ENV_NAME" --arg fallback_name "$fallback_name" '
              . as $root
              | ($root.enabled // true) as $enabled
              | ($root.build.environment_configs[$env] // null) as $ec
              | select($enabled and ($ec != null))
              | ($ec.enabled // true) as $env_enabled
              | select($env_enabled)
              | {
                  repo:              $root.build.repo,
                  workflow_filename: $root.build.workflow_file,
                  branch:            ($ec.branch // $root.build.branch // "main"),
                  name:              ($root.name // $fallback_name),
                  config_variables:  ($root.config_variables // [])
                }
            ')"
      
            if [ -n "$obj" ] && [ "$obj" != "null" ]; then
              arr="$(jq -c --argjson o "$obj" '. + [$o]' <<<"$arr")"
            fi
          done
      
          echo "matrix=$(jq -c '.' <<<"$arr")" >> "$GITHUB_OUTPUT"

  fanout:
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload config artifacts
        id: upload_config_artifacts
        uses: ./.github/actions/upload_config_artifacts
        with:
          service_name: ${{ matrix.name }}
          env_name:     ${{ env.ENVIRONMENT_NAME }}
          config_variables_json: ${{ toJson(matrix.config_variables) }}

      - name: Trigger remote workflow (composite)
        id: trigger-target-artifact
        uses: ./.github/actions/trigger_remote_workflow
        with:
          token:               ${{ env.TRIGGER_TOKEN }}
          target_repo:         ${{ matrix.repo }}
          event_type:          import-from-orchestrator
          branch:              ${{ matrix.branch }}
          workflow_filename:   ${{ matrix.workflow_filename }}
          source_owner:        ${{ github.repository_owner }}
          source_repo:         ${{ github.event.repository.name }}
          artifact_name_files: ${{ steps.upload_config_artifacts.outputs.artifact_name_files }}
          artifact_name_vars:  ${{ steps.upload_config_artifacts.outputs.artifact_name_vars }}
          run_id:              ${{ steps.upload_config_artifacts.outputs.run_id }}
          save_path:           ${{ env.CONFIGS_SAVE_PATH }}
