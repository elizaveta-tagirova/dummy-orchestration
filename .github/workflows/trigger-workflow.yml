name: Trigger Remote Workflows

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'deploy env'
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
  push:
    paths:
      - 'trigger-targets.yml'

env:
  TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
  VARS_TOKEN: ${{ secrets.VARS_TOKEN }}
  ENVIRONMENT_NAME: ${{ inputs.environment-name }}

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test action
        uses: ./.github/actions/test_action

  load-matrix:
    needs: [test-action]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq

      - name: Read targets from config file
        id: set-targets
        shell: bash
        run: |
          echo "Trigger targets:"
          cat trigger-targets.yml
          MATRIX_JSON=$(yq -j '.' trigger-targets.yml | jq -c '.')
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  fanout:
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone target repo
        id: clone_target_repo
        uses: ./.github/actions/clone_target_repo
        with:
          token: ${{ env.TRIGGER_TOKEN }}
          target_repo: ${{ matrix.repo }}
          target_branch: ${{ matrix.branch }}

      - name: Check target repo dir
        run: echo "target repo dir ${{ steps.clone_target_repo.outputs.repo_dir }}"

      - name: Test composite action push_config_files
        id: push_config_files
        uses: ./.github/actions/push_config_files
        with:
          service_name: ${{ matrix.name }}
          token: ${{ env.TRIGGER_TOKEN }}
          target_repo: ${{ matrix.repo }}
          env_name: ${{ env.ENVIRONMENT_NAME }}
          target_branch: ${{ matrix.branch }}
          target_repo_dir: ${{ steps.clone_target_repo.outputs.repo_dir }}

      - name: Test prev outputs
        run: echo "Outputs ${{ toJson(steps.push_config_files.outputs) }}"

      - name: Test composite action upload_config_artifacts
        id: upload_config_artifacts
        uses: ./.github/actions/upload_config_artifacts
        with:
          service_name: ${{ matrix.name }}
          env_name: ${{ env.ENVIRONMENT_NAME }}

      - name: Test prev outputs
        run: echo "Outputs ${{ toJson(steps.upload_config_artifacts.outputs) }}"

      - name: Trigger remote workflow with import-from-orchestrator
        id: trigger-target-artifact
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ matrix.repo }}"
          SOURCE_OWNER="${{ github.repository_owner }}"
          SOURCE_REPO="${{ github.event.repository.name }}"
          WORKFLOW="${{ matrix.workflow_filename }}"
          BRANCH="${{ matrix.branch }}"
          ARTIFACT_NAME="${{ steps.upload_config_artifacts.outputs.artifact_name }}"
          RUN_ID="${{ steps.upload_config_artifacts.outputs.run_id }}"

          echo "Triggering ${REPO}/${WORKFLOW} on branch ${BRANCH}"
          
          payload=$(printf '{"event_type":"import-from-orchestrator","client_payload":{"branch":"%s","workflow_filename":"%s","source_repo":"%s", "source_owner":"%s", "artifact_name":"%s", "run_id":"%s"}}' \
          "${BRANCH}" "${WORKFLOW}" "${SOURCE_REPO}" "${SOURCE_OWNER}" "${ARTIFACT_NAME}" "${RUN_ID}")

          curl -sS -f -X POST \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d "${payload}"

      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: "3.x" }

      - name: Install renderer deps
        run: python -m pip install -r tools/requirements.txt

      - name: Render configs
        run: python tools/render_config.py --configs '${{ toJson(matrix.configs) }}' --environment ${ENVIRONMENT_NAME}

      - name: Clone target repo
        run: |
          git clone --branch ${{ matrix.branch }} https://x-access-token:${TRIGGER_TOKEN}@github.com/${{ matrix.repo }} target-repo

      - name: Push generated configs
        run: |
          cd target-repo
          git config user.name "Dummy Orchestrator"
          git config user.email "dummy-orchestrator@example.com"
          mkdir -p .config/generated
          rsync -a ../out/${{ matrix.name }}/${ENVIRONMENT_NAME} .config/generated/
          git add .config/generated
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(config): auto push config from orchestrator"
            git push origin ${{ matrix.branch }}
          fi

      - name: Push config variables
        run: |
          REPO="${{ matrix.repo }}"
          VARS='${{ toJson(matrix.config_variables) }}'
          
          echo "$VARS" | jq -c '.[]' | while read -r entry; do
            schema=$(echo "$entry" | jq -r '.schema // empty')
            values_path=$(echo "$entry" | jq -r '.values')
            values_path=$(echo "$values_path" | sed "s/{{env}}/${ENVIRONMENT_NAME}/g")
          
            yq -o=json '.' "$values_path" | jq -c 'to_entries[]' | while read -r kv; do
              k=$(echo "$kv" | jq -r '.key')
              v=$(echo "$kv" | jq -r '.value')
              payload=$(jq -n --arg name "$k" --arg value "$v" '{name:$name, value:$value}')
              update_code=$(curl -X PATCH \
                -H "Authorization: token ${VARS_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${REPO}/actions/variables/$k \
                -d "$payload"
              )
              echo "Update code: ${update_code}"
              if [ "$update_code" = "404" ]; then
                create_code=$(curl -X POST \
                  -H "Authorization: token ${VARS_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/${REPO}/actions/variables/$k \
                  -d "$payload")
                echo "Create code: ${create_code}"
              fi
            done
          done

      - name: Trigger remote workflow
        id: trigger-target
        shell: bash
        run: |
          REPO="${{ matrix.repo }}"
          WORKFLOW="${{ matrix.workflow_filename }}"
          BRANCH="${{ matrix.branch }}"

          echo "Triggering ${REPO}/${WORKFLOW} on branch ${BRANCH}"

          curl -sS -X POST \
            -H "Authorization: token ${TRIGGER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}"
