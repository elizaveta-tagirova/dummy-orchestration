name: dummy-microservice
enabled: true  # optional, default true

build:
  repo: elizaveta-tagirova/dummy-microservice
  workflow_file: test-workflow.yml

  environment_configs:
    test-env:
      branch: master
      enabled: false
    pre-prod:
      branch: master
      enabled: false
    prod:
      branch: master
      enabled: true

  env:
    image_tag: dev

config_variables:
  - set_name: app-vars-set-1
    schema: schema/app-vars-set-1.schema.json
    values: values/dummy-microservice/{{env}}/app-vars-set-1.yaml
